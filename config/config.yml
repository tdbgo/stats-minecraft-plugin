# Stats plugin configuration
# This file is copied to plugins/Stats/config.yml on first run.

config-version: 4

setup:
  # Safe by default: no database connection or collection until explicitly enabled.
  enabled: false

database:
  # sqlite | postgres | mysql
  type: sqlite
  tablePrefix: "mstats_"
  # JDBC query/socket timeout. Connection acquisition has its own pool timeout below.
  queryTimeoutSeconds: 30

  sqlite:
    file: "stats.db"
    pragmas:
      journal_mode: "WAL"
      synchronous: "NORMAL"
      foreign_keys: "ON"
    busyTimeoutMs: 5000

  host: "127.0.0.1"
  port: 5432 # Use 3306 for MySQL/MariaDB.
  database: "minecraft"
  schema: "public" # PostgreSQL only.
  username: "stats"
  password: "CHANGE_ME"

  ssl:
    enabled: false
    mode: "prefer" # PostgreSQL: disable|prefer|required|verify-ca|verify-full

  pool:
    # Flushes are serialized, so two remote DB connections are sufficient.
    maximumPoolSize: 2
    # Keep no idle connection when the server is inactive.
    minimumIdle: 0
    connectionTimeoutMs: 5000
    idleTimeoutMs: 600000
    maxLifetimeMs: 1800000

  migrations:
    autoCreateTables: true
    autoMigrate: true

flush:
  # Empty intervals perform no JDBC call.
  # Non-empty snapshots are durably spooled before database transmission.
  intervalSeconds: 300
  maxBatchRows: 5000

tick:
  # Playtime, AFK, and sampled movement accounting interval.
  intervalSeconds: 5

afk:
  thresholdSeconds: 60

commands:
  enabled: true
  allowReload: true
  allowDbPing: true
  allowForceFlush: true

# Chat bodies, IP addresses, inventory snapshots, and coordinates are never stored.
# Risk alerting is not implemented by this collector; analyze stored aggregates externally.
